version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: universal_assessment_pro
      POSTGRES_USER: uap_user
      POSTGRES_PASSWORD: uap_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uap_user -d universal_assessment_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass uap_redis_secret
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "uap_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
